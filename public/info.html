<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Електронні компоненти</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/info.css">
</head>
<body>
  <nav id="sb-navbar"></nav>

  <div class="info-top">
    <span class="info-title" id="info-title"></span>
  </div>

  <div class="info-wrap">
    <div class="info-intro">
      <h2 id="info-intro1"></h2>
      <p id="info-intro2"></p>
    </div>
    <div class="info-wire" id="info-wire"></div>
  </div>

  <div class="info-panel" id="info-panel">
    <button class="info-close" id="info-close">&#x2715;</button>
    <img class="info-img" id="info-img" src="" alt="">
    <div class="info-num" id="info-num"></div>
    <div class="info-name" id="info-name"></div>
    <div class="info-divider"></div>
    <div class="info-section">
      <div class="info-label" id="info-label1"></div>
      <p class="info-text" id="info-history"></p>
    </div>
    <div class="info-divider"></div>
    <div class="info-section">
      <div class="info-label" id="info-label2"></div>
      <p class="info-text" id="info-how"></p>
    </div>
    <div class="info-divider"></div>
    <div>
      <div class="info-label" id="info-label3"></div>
      <ul class="info-facts" id="info-facts"></ul>
    </div>
  </div>

  <script type="module" src="/js/info/main.js"></script>
</body>
</html>
